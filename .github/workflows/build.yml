name: Generate Minecraft Jar Mod
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Java Runtime Environment
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Direct Gradle Engine
        uses: gradle/actions/setup-gradle@v4

      - name: Build Mod File with Direct Gradle
        run: gradle build --no-daemon

      - name: Upload Finished Jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-InvSaver-Mod-Jar
          path: build/libs/*.jar
          if-no-files-found: warn
          
